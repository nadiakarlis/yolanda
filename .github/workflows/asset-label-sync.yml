name: "Asset Field-to-Label Sync"

on:
  project_card_move: # Legacy project tracking fallback
  project_item:
    types: [edited] # Triggers when custom fields or statuses change

permissions:
  issues: write
  repository-projects: read

jobs:
  sync_labels:
    name: "Sync Status Field to Label"
    runs-on: ubuntu-latest
    # Ensure this only runs for field updates related to your Status tracking
    if: github.event.changes.field_value.field_name == 'Status' || github.event.action == 'edited'
    
    steps:
      - name: "Get Project Item Data"
        id: parse_data
        uses: actions/github-script@v7
        with:
          script: |
            // Extract the new status value from the event payload
            const newStatus = context.payload.project_item.field_values.Status.value;
            const issueNumber = context.payload.project_item.content.number;
            const issueBody = context.payload.project_item.content.body || "";
            
            core.setOutput('status', newStatus);
            core.setOutput('issue_number', issueNumber);
            
            // Detect Vendor via hardware signatures
            let vendor = "unknown";
            if (issueBody.toLowerCase().includes("dell") || issueBody.toLowerCase().includes("poweredge")) {
              vendor = "dell";
            } else if (issueBody.toLowerCase().includes("hpe") || issueBody.toLowerCase().includes("proliant")) {
              vendor = "hpe";
            }
            core.setOutput('vendor', vendor);

      - name: "Update Asset Status Labels"
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = parseInt("${{ steps.parse_data.outputs.issue_number }}");
            const currentStatus = "${{ steps.parse_data.outputs.status }}".toLowerCase().replace(/\s+/g, '-');
            const vendor = "${{ steps.parse_data.outputs.vendor }}";
            
            // 1. Fetch current labels on the hardware issue
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number
            });
            
            const existingLabels = issue.labels.map(l => l.name);
            
            // 2. Clear old status labels (prefixed with status:)
            const cleanedLabels = existingLabels.filter(label => !label.startsWith('status:'));
            
            // 3. Add the brand new status label mapping
            cleanedLabels.push(`status:${currentStatus}`);
            
            // 4. Inject vendor label dynamically if verified
            if (vendor !== "unknown" && !cleanedLabels.includes(`vendor:${vendor}`)) {
              cleanedLabels.push(`vendor:${vendor}`);
            }
            
            // 5. Apply the unified label list back to the asset issue
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              labels: cleanedLabels
            });
